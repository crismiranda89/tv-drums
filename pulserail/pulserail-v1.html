<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#140826">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pulse Rail</title>
<style>
  :root{--a:#ff3d9a;--b:#3de8ff;--ink:#f7f3ff;--dim:rgba(240,234,255,.62)}
  html,body{margin:0;height:100%;background:#140826;overflow:hidden;color:var(--ink);
    font-family:system-ui,-apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
  canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%}
  body.aim,body.aim *{cursor:none!important}
  .hidden{display:none!important}
  button{font:inherit;color:inherit;cursor:pointer}
  #reticle{position:fixed;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;pointer-events:none;z-index:6;display:none}
  #reticle i{position:absolute;left:0;top:0;right:0;bottom:0;border:2px solid #fff;border-radius:50%;box-shadow:0 0 10px var(--b),inset 0 0 8px var(--b)}
  #reticle b{position:absolute;left:21px;top:21px;width:4px;height:4px;border-radius:50%;background:#fff}
  #reticle.lock i{border-color:var(--a);box-shadow:0 0 12px var(--a),inset 0 0 8px var(--a)}
  #hud{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:4}
  #prog{position:absolute;left:0;top:0;right:0;height:4px;background:rgba(255,255,255,.08)}
  #prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--b),var(--a))}
  #scoreBox{position:absolute;top:14px;left:0;right:0;text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.6)}
  #score{font-size:40px;font-weight:900;font-style:italic;letter-spacing:.02em}
  #combo{font-size:13px;font-weight:800;letter-spacing:.25em;color:var(--dim);text-transform:uppercase}
  #combo b{color:#fff;font-size:18px;letter-spacing:.05em}
  #mult{color:var(--a)}
  #shield{position:absolute;top:18px;left:18px}
  #shield b{display:inline-block;width:26px;height:12px;margin-right:6px;border-radius:3px;background:var(--b);box-shadow:0 0 10px var(--b);transform:skewX(-20deg)}
  #shield b.off{background:rgba(255,255,255,.12);box-shadow:none}
  #pauseBtn{position:absolute;left:14px;bottom:14px;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.25);
    background:rgba(0,0,0,.35);pointer-events:auto;font-weight:900;font-size:15px}
  #dmg{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:3;opacity:0;
    background:radial-gradient(ellipse at center,rgba(255,0,60,0) 45%,rgba(255,0,60,.55) 100%)}
  .pop{position:fixed;left:0;top:0;z-index:5;pointer-events:none;font-weight:900;font-style:italic;font-size:22px;white-space:nowrap;
    text-shadow:0 0 10px rgba(0,0,0,.8);will-change:transform,opacity}
  .pop small{display:block;font-size:12px;letter-spacing:.2em;color:#ffe36e;text-align:center}
  #fps{position:fixed;right:10px;bottom:10px;z-index:9;font:13px ui-monospace,Menlo,monospace;color:rgba(225,225,235,.85);
    background:rgba(0,0,0,.55);padding:6px 9px;border-radius:8px;cursor:pointer}
  .tvua #fps{right:3.5vw;bottom:4vh;font-size:18px;padding:8px 12px}
  .tvua #shield{top:4vh;left:3.5vw}.tvua #scoreBox{top:3.5vh}.tvua #pauseBtn{left:3.5vw;bottom:4vh}
  .ov{position:fixed;left:0;top:0;right:0;bottom:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;background:radial-gradient(ellipse at center,rgba(20,8,38,.35),rgba(10,4,22,.82));padding:20px;box-sizing:border-box}
  h1{margin:0;font-size:64px;font-weight:900;font-style:italic;letter-spacing:.04em;line-height:1;
    background:linear-gradient(180deg,#fff 30%,#ffb3e0);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,61,154,.55))}
  h1 span{background:linear-gradient(180deg,#fff 20%,var(--b));-webkit-background-clip:text;color:transparent;margin-left:.25em}
  h2{margin:0 0 14px;font-size:30px;font-weight:900;font-style:italic;letter-spacing:.06em}
  .tag{margin:10px 0 22px;color:var(--dim);letter-spacing:.3em;text-transform:uppercase;font-size:13px;font-weight:700}
  .song{display:flex;align-items:center;justify-content:space-between;width:min(440px,88vw);box-sizing:border-box;margin:0 0 12px;padding:14px 18px;
    border-radius:16px;border:1px solid rgba(255,255,255,.14);background:rgba(18,10,34,.75);text-align:left;border-left:5px solid var(--c)}
  .song:focus,.song:hover,.btn:focus,.btn:hover{outline:none;border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35),0 0 24px var(--c,rgba(61,232,255,.5))}
  .song .n{font-size:22px;font-weight:900;font-style:italic}
  .song .m{font-size:12px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;font-weight:700;margin-top:3px}
  .song .best{font-size:12px;color:var(--dim);letter-spacing:.1em;text-align:right;font-weight:700}
  .btn{min-width:200px;margin:6px;padding:13px 26px;border-radius:30px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);
    font-weight:900;letter-spacing:.2em;text-transform:uppercase;font-size:14px}
  .btn.main{background:linear-gradient(90deg,var(--a),#ff7a3d);border-color:transparent}
  .row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center}
  .hint{margin-top:14px;color:var(--dim);font-size:13px;max-width:520px;line-height:1.5}
  .hint b{color:#fff}
  .gfxRow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:12px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:700}
  .seg{display:inline-flex;margin:0 10px;border:1px solid rgba(255,255,255,.2);border-radius:20px;overflow:hidden}
  .seg button{background:none;border:0;padding:7px 12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--dim)}
  .seg button.on{background:rgba(255,255,255,.18);color:#fff}
  .seg button:focus{outline:2px solid #fff;outline-offset:-2px}
  .live{font:12px ui-monospace,Menlo,monospace;color:#fff;min-width:15ch;text-align:left}
  #results .grade{font-size:110px;font-weight:900;font-style:italic;line-height:1;margin:4px 0 8px;filter:drop-shadow(0 0 20px var(--a))}
  #results table{margin:0 auto 16px;border-collapse:collapse;font-size:16px}
  #results td{padding:4px 14px}#results td:first-child{color:var(--dim);text-align:right;letter-spacing:.12em;text-transform:uppercase;font-size:12px;font-weight:700}
  #results td:last-child{text-align:left;font-weight:800}
  #results .nb{color:#ffe36e;font-size:13px;letter-spacing:.2em;font-weight:800;margin-bottom:6px;min-height:18px}
  /* calibration + controller test */
  #calib{background:rgba(8,3,18,.6)}
  #calDot{position:fixed;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 30px var(--b)}
  #calDot:after{content:'';position:absolute;left:31px;top:31px;width:8px;height:8px;border-radius:50%;background:var(--a)}
  #calText{position:fixed;left:0;right:0;top:64%;font-size:18px;line-height:1.5}
  #pad{display:grid;grid-template-columns:repeat(3,74px);grid-template-rows:repeat(3,74px);margin:10px auto 14px}
  #pad div,.kchip{display:flex;align-items:center;justify-content:center;border-radius:14px;border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.05);font-weight:900;font-size:13px;letter-spacing:.1em;margin:3px;transition:background .25s}
  #pad div.hit,.kchip.hit{background:var(--a);box-shadow:0 0 18px var(--a);transition:none}
  #pad div.seen,.kchip.seen{border-color:var(--b)}
  .kchip{display:inline-flex;padding:9px 14px}
  #testLog{font:13px ui-monospace,Menlo,monospace;color:var(--dim);min-height:60px;line-height:1.6;max-width:640px}
  .portrait h1{font-size:44px}
  @media (max-height:520px){h1{font-size:44px}.tag{margin:6px 0 10px}.song{padding:9px 14px;margin-bottom:8px}.song .n{font-size:18px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="reticle"><i></i><b></b></div>
<div id="dmg"></div>
<div id="hud" class="hidden">
  <div id="prog"><i></i></div>
  <div id="shield"><b></b><b></b><b></b></div>
  <div id="scoreBox"><div id="score">0</div><div id="combo"><b id="comboN">0</b> combo · <span id="mult">x1</span></div></div>
  <button id="pauseBtn" aria-label="Pause">II</button>
</div>
<div id="fps" title="Click to change graphics"></div>

<div id="title" class="ov">
  <h1>PULSE<span>RAIL</span></h1>
  <div class="tag">Shoot to the beat</div>
  <div id="songs"></div>
  <div class="row"><button class="btn" id="testBtn">Controller test</button><button class="btn" id="ctlBtn"></button></div>
  <div class="gfxRow">Graphics <div class="seg gfxSeg"></div><span class="live"></span></div>
  <div class="hint" id="hint"></div>
</div>
<div id="pause" class="ov hidden">
  <h2>PAUSED</h2>
  <button class="btn main" id="resumeBtn">Resume</button>
  <button class="btn" id="restartBtn">Restart</button>
  <button class="btn" id="recalBtn">Recalibrate aim</button>
  <button class="btn" id="quitBtn">Songs</button>
  <div class="gfxRow">Graphics <div class="seg gfxSeg"></div><span class="live"></span></div>
</div>
<div id="results" class="ov hidden">
  <div class="tag" id="resSong"></div>
  <div class="grade" id="resGrade">A</div>
  <div class="nb" id="resNew"></div>
  <table id="resTable"></table>
  <div class="row"><button class="btn main" id="retryBtn">Retry</button><button class="btn" id="songsBtn">Songs</button></div>
</div>
<div id="calib" class="ov hidden"><div id="calDot"></div><div id="calText"></div></div>
<div id="test" class="ov hidden">
  <h2>CONTROLLER TEST</h2>
  <div class="hint">Press every button. Lit = the TV sends it to the game. <b>Back</b> leaves.</div>
  <div id="pad"><span></span><div data-k="up">UP</div><span></span><div data-k="left">LEFT</div><div data-k="ok">OK</div><div data-k="right">RIGHT</div><span></span><div data-k="down">DOWN</div><span></span></div>
  <div class="row"><span class="kchip" data-k="wheelup">WHEEL ▲</span><span class="kchip" data-k="wheeldown">WHEEL ▼</span><span class="kchip" data-k="click">CLICK</span><span class="kchip" data-k="move">POINTER</span><span class="kchip" data-k="back">BACK</span></div>
  <div id="testLog"></div>
  <div class="row"><button class="btn" id="testCalBtn">Calibrate centre</button><button class="btn" id="testDoneBtn">Done</button></div>
</div>

<script src="../three-0.160.0.min.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const canvas = $('c');
const UA = navigator.userAgent;
const QS = new URLSearchParams(location.search);
const AUTOPLAY = QS.has('autoplay');
const TVUA = /Tizen|Web0S|webOS|SMART-TV|SmartTV|NetCast|HbbTV|BRAVIA|VIDAA|AFT[A-Z]|CrKey|GoogleTV|Android TV/i.test(UA);
const LGTV = /Web0S|webOS|NetCast/i.test(UA);
// ---------- graphics profile: 'tv' = Low, 'phone' = Medium, 'pc' = High ----------
const GKEY = 'pulserail.gfx';
const qGfx = QS.get('gfx');
if (qGfx) { if (/^(tv|phone|pc)$/.test(qGfx)) localStorage.setItem(GKEY, qGfx); else localStorage.removeItem(GKEY); }
let GPU = '';
try { const g = document.createElement('canvas').getContext('webgl'), x = g && g.getExtension('WEBGL_debug_renderer_info');
  GPU = x ? String(g.getParameter(x.UNMASKED_RENDERER_WEBGL)) : ''; const lc = g && g.getExtension('WEBGL_lose_context'); if (lc) lc.loseContext(); } catch (e) {}
const PHONEUA = !TVUA && (/Android|iPhone|iPad|Mobile/i.test(UA) || (matchMedia('(pointer:coarse)').matches && Math.min(innerWidth, innerHeight) < 900));
const WEAKGPU = /Mali|PowerVR|Adreno|VideoCore|Vivante|Realtek|MStar|Novatek|SwiftShader|llvmpipe/i.test(GPU);
const STORED = localStorage.getItem(GKEY);
const PROFILE = STORED || (TVUA ? 'tv' : PHONEUA ? 'phone' : WEAKGPU ? 'tv' : 'pc');
const TIER = {
  tv:    { pr: Math.min(1, 1280 / Math.max(1, innerWidth)), aa: false, segs: 5, back: false, shards: 6,  rows: 2.6, motes: 0,   glow: false },
  phone: { pr: 1.5, aa: false, segs: 6, back: true,  shards: 10, rows: 1.9, motes: 60,  glow: true },
  pc:    { pr: 2,   aa: true,  segs: 8, back: true,  shards: 16, rows: 1.5, motes: 160, glow: true },
}[PROFILE];
if (PROFILE === 'tv') document.documentElement.classList.add('tv');
if (TVUA) document.documentElement.classList.add('tvua');

const R = new THREE.WebGLRenderer({ canvas, antialias: TIER.aa, powerPreference: PROFILE === 'pc' ? 'high-performance' : 'default' });
R.setPixelRatio(Math.min(window.devicePixelRatio || 1, TIER.pr));
R.outputColorSpace = THREE.SRGBColorSpace;
const GFX = { slow: 0, steps: 0 };
function gfxWatch(dt) {   // frames slow for ~2 s: drop the resolution by 20% (floor 0.45)
  if (document.hidden || dt > 0.25) return;
  GFX.slow = dt > 0.028 ? GFX.slow + dt : Math.max(0, GFX.slow - dt * 0.5);
  if (GFX.slow < 2) return;
  GFX.slow = 0; const pr = R.getPixelRatio(); if (pr > 0.45) { GFX.steps++; R.setPixelRatio(Math.max(0.45, pr * 0.8)); fit(); }
}
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); setTimeout(() => location.reload(), 1500); });

const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(62, 1, 0.08, 170);
scene.add(cam);

// ---------- palettes ----------
const PALS = [
  { sky: [0x12052e, 0x6a1a6e, 0xff7a52], fog: 0x4a1650, floor: 0x1b0b30, walk: 0x2a1446, bldg: [0x2b1645, 0x351a55, 0x24123c, 0x3d1c4f],
    neonA: 0xff3d9a, neonB: 0x3de8ff, win: [0xffcf6e, 0x3de8ff, 0xff66bb, 0xffffff], sun: ['#ffe066', '#ff3d6e'], hemi: [0xff9ad5, 0x1a0b2e],
    sunL: 0xffa070, enemy: 0x17121f, enemy2: 0x2c2436, armor: 0xffb02e, visor: 0xff2e63, bullet: 0xff8a1f },
  { sky: [0x03122a, 0x0c4c6a, 0x6dffd0], fog: 0x0b3448, floor: 0x061523, walk: 0x0d2235, bldg: [0x0c2236, 0x123049, 0x0a1b2c, 0x163a52],
    neonA: 0xffd23d, neonB: 0x3dffb4, win: [0xfff2a8, 0x3dffb4, 0xffd23d, 0xffffff], sun: ['#eafff8', '#3dffb4'], hemi: [0x9affe6, 0x061523],
    sunL: 0xc8fff0, enemy: 0x10161c, enemy2: 0x233140, armor: 0xff6a3d, visor: 0xffd23d, bullet: 0xff4a3d },
  { sky: [0x1a0408, 0x6e1420, 0xffb347], fog: 0x4e1418, floor: 0x1a0809, walk: 0x2a1010, bldg: [0x2e1212, 0x3d1616, 0x261010, 0x4a1c14],
    neonA: 0xff4d2e, neonB: 0xffd23d, win: [0xffd9a0, 0xff4d2e, 0xffd23d, 0xffffff], sun: ['#fff0b0', '#ff4d2e'], hemi: [0xffb08a, 0x1a0808],
    sunL: 0xffc080, enemy: 0x141014, enemy2: 0x2e2228, armor: 0x3de8ff, visor: 0x3de8ff, bullet: 0xff3dd0 },
];

// ---------- geometry helpers: merge many boxes into one vertex-coloured mesh ----------
const BOXN = new THREE.BoxGeometry(1, 1, 1).toNonIndexed();
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _v = new THREE.Vector3(), _s = new THREE.Vector3(), _c = new THREE.Color();
function mtx(x, y, z, sx, sy, sz, rx, ry, rz) { _e.set(rx || 0, ry || 0, rz || 0); _q.setFromEuler(_e); return _m.compose(_v.set(x, y, z), _q, _s.set(sx, sy, sz)); }
function Acc() { return { p: [], c: [] }; }
function put(acc, geo, m, col, k) {
  const g = (geo.index ? geo.toNonIndexed() : geo.clone()).applyMatrix4(m); const a = g.attributes.position.array;
  _c.set(col); if (k) _c.multiplyScalar(k);
  for (let i = 0; i < a.length; i++) acc.p.push(a[i]);
  for (let i = 0; i < a.length; i += 3) acc.c.push(_c.r, _c.g, _c.b);
  g.dispose();
}
function bake(acc) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(acc.p, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(acc.c, 3));
  g.computeVertexNormals(); g.computeBoundingSphere(); return g;
}
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function glowTex() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 64; const x = cv.getContext('2d');
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.25, 'rgba(255,255,255,.6)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64); const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const GLOW = glowTex();

// ---------- world: sky, rail segments, lights ----------
const U = 3;          // world units travelled per beat
const SEG = 24;       // segment length (8 beats)
const litMat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });
const neonMat = new THREE.MeshBasicMaterial({ vertexColors: true });
const winMat = new THREE.MeshBasicMaterial({ vertexColors: true });
const hemi = new THREE.HemisphereLight(0xffffff, 0x000000, 1.6); scene.add(hemi);
const sunL = new THREE.DirectionalLight(0xffffff, 2.2); sunL.position.set(-0.5, 1, -0.8); scene.add(sunL); scene.add(sunL.target);
let world = null, PAL = PALS[0], segments = [], skyGroup = null, motes = null;

function buildSegment(pal, rnd, idx) {
  const lit = Acc(), neon = Acc(), win = Acc();
  put(lit, BOXN, mtx(0, -0.5, -SEG / 2, 12, 1, SEG), pal.floor);
  for (const s of [-1, 1]) {
    put(lit, BOXN, mtx(s * 7.25, -0.35, -SEG / 2, 2.5, 1, SEG), pal.walk);
    put(neon, BOXN, mtx(s * 6.0, 0.17, -SEG / 2, 0.09, 0.05, SEG), pal.neonB);
    // street lamps every half segment
    for (let k = 0; k < 2; k++) { const z = -4 - k * 12;
      put(lit, BOXN, mtx(s * 6.6, 2.4, z, 0.14, 4.8, 0.14), pal.walk, 1.6);
      put(lit, BOXN, mtx(s * 6.1, 4.8, z, 1.1, 0.12, 0.14), pal.walk, 1.6);
      put(win, BOXN, mtx(s * 5.65, 4.7, z, 0.35, 0.08, 0.3), pal.win[3]); }
  }
  for (let k = 0; k < 4; k++) put(win, BOXN, mtx(0, 0.01, -(k * 6 + 1.5), 0.14, 0.02, 2.6), pal.neonA, 0.8);
  // gate across the street at the start of every segment (flashes on the downbeat)
  const gc = idx % 2 ? pal.neonA : pal.neonB;
  put(neon, BOXN, mtx(-6.4, 3.6, -0.5, 0.32, 7.2, 0.32), gc); put(neon, BOXN, mtx(6.4, 3.6, -0.5, 0.32, 7.2, 0.32), gc);
  put(neon, BOXN, mtx(0, 7.2, -0.5, 13.1, 0.32, 0.32), gc);
  put(lit, BOXN, mtx(0, 7.75, -0.5, 13.6, 0.7, 0.9), pal.bldg[0], 1.3);
  // buildings along both sides
  for (const s of [-1, 1]) {
    let z = 0;
    while (z > -SEG + 0.5) {
      const d = Math.min(-z + SEG, 4 + rnd() * 6) - 0.4, w = 6 + rnd() * 9, h = 7 + rnd() * (PROFILE === 'tv' ? 16 : 26);
      const zc = z - d / 2, xc = s * (8.5 + w / 2), col = pal.bldg[Math.floor(rnd() * pal.bldg.length)], k = 0.85 + rnd() * 0.35;
      put(lit, BOXN, mtx(xc, h / 2, zc, w, h, d), col, k);
      if (rnd() < 0.6) put(lit, BOXN, mtx(xc + s * w * 0.1, h + 1, zc, w * 0.45, 2, d * 0.5), col, k * 1.2);
      if (rnd() < 0.35) { put(lit, BOXN, mtx(xc - s * w * 0.2, h + 3.5, zc, 0.12, 5, 0.12), col, 1.6); put(neon, BOXN, mtx(xc - s * w * 0.2, h + 6.1, zc, 0.3, 0.3, 0.3), pal.neonA); }
      // lit window bands on the street side
      const fx = s * (8.5 - 0.04);
      for (let y = 2; y < h - 1; y += TIER.rows) {

canvas.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch') return;
  if (inMode !== 'mouse') { inMode = 'mouse'; updateAimMode(); }
  setAimPx(e.clientX, e.clientY); if (state === 'test') testHit('move', 'pointer ' + Math.round(e.clientX) + ',' + Math.round(e.clientY));
});
document.addEventListener('pointermove', e => { if (e.target !== canvas && e.pointerType !== 'touch') { ptrRaw.x = e.clientX; ptrRaw.y = e.clientY; if (state === 'test') testHit('move', 'pointer ' + Math.round(e.clientX) + ',' + Math.round(e.clientY)); } });
canvas.addEventListener('pointerdown', e => {
  if (state === 'calib') { finishCalib(false); return; }
  if (state !== 'play') return; e.preventDefault();
  const m = e.pointerType === 'touch' ? 'touch' : 'mouse'; if (m !== inMode) { inMode = m; updateAimMode(); }
  setAimPx(e.clientX, e.clientY); fireOnce();
});
document.addEventListener('click', e => { if (state === 'test') testHit('click', 'click at ' + Math.round(e.clientX) + ',' + Math.round(e.clientY)); });
document.addEventListener('wheel', e => { if (state === 'test') testHit(e.deltaY < 0 ? 'wheelup' : 'wheeldown', 'wheel ' + Math.round(e.deltaY)); }, { passive: true });
// webOS tells the page when the Magic Remote pointer shows or hides (it hides after an arrow press)
document.addEventListener('cursorStateChange', e => { const v = e.detail && e.detail.visibility; if (state === 'test') testLog('pointer ' + (v ? 'shown' : 'hidden')); });
const keysHeld = {};
const KEYNAME = { 37: 'left', 38: 'up', 39: 'right', 40: 'down', 13: 'ok', 461: 'back', 10009: 'back', 27: 'back', 8: 'back' };
addEventListener('keydown', e => {
  const k = e.keyCode, name = KEYNAME[k];
  if (state === 'test') { e.preventDefault(); if (name === 'back') { toTitle(); return; } testHit(name || 'other', 'key ' + (e.key || '') + ' code ' + k); return; }
  if (state === 'calib') { e.preventDefault(); if (name === 'ok' || k === 32) finishCalib(false); else if (name === 'back') finishCalib(true); return; }
  if (name === 'back' || k === 80) {
    if (state === 'play') { e.preventDefault(); pauseGame(); } else if (state === 'paused') { e.preventDefault(); resumeGame(); }
    else if (state === 'results') { e.preventDefault(); toTitle(); }
    return;
  }
  if (state !== 'play') {   // menus: arrows move the focus
    if (k === 38 || k === 37) { if (navFocus(-1)) e.preventDefault(); } else if (k === 40 || k === 39) { if (navFocus(1)) e.preventDefault(); }
    return;
  }
  e.preventDefault();
  if (k === 13 || k === 32) { if (!e.repeat) fireOnce(); return; }
  if (k >= 37 && k <= 40) {
    if (ctl === 'pistol') { if (!e.repeat) fireOnce(); return; }   // pistol grip: every arrow is a trigger
    keysHeld[k] = true; if (inMode !== 'keys') { inMode = 'keys'; updateAimMode(); }
  }
});
addEventListener('keyup', e => { keysHeld[e.keyCode] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
// controller test
let testSeen = {};
function testLog(s) { const l = $('testLog'); l.innerHTML = s + '<br>' + l.innerHTML.split('<br>').slice(0, 4).join('<br>'); }
function testHit(k, msg) {
  const el = document.querySelector('#test [data-k="' + k + '"]');
  if (el) { el.classList.add('seen'); el.classList.add('hit'); setTimeout(() => el.classList.remove('hit'), 160); }
  if (k !== 'move' || !testSeen.move) testLog(msg); testSeen[k] = 1;
  if (k !== 'move' && ac) SFX.shot(k === 'ok', 72);
}

// ---------- resize ----------
function fit() {
  const w = innerWidth, h = innerHeight; R.setSize(w, h, false); cam.aspect = w / h;
  cam.fov = w >= h ? 62 : Math.min(88, 2 * Math.atan(Math.tan(32 * Math.PI / 180) / cam.aspect) * 180 / Math.PI);
  cam.updateProjectionMatrix();
  if (w >= h) gun.position.set(0.3, -0.27, -0.6); else gun.position.set(0.14, -0.42, -0.62);
  document.documentElement.classList.toggle('portrait', h > w);
}
addEventListener('resize', fit); fit();

// ---------- main loop ----------
let last = performance.now(), shake = 0, dmgFlash = 0, muzzleT = 0;
const _wt = new THREE.Vector3(), _ndc = new THREE.Vector2();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000); last = now; fpsTick(now); gfxWatch(dt);
  let beat;
  const playing = run && (state === 'play' || state === 'paused' || state === 'results' || (state === 'calib' && run));
  if (playing) { sched(); beat = songBeat(); } else { attractBeat += dt * 100 / 60; beat = attractBeat; }
  const frac = beat - Math.floor(beat);
  // camera rides the rail
  const z = playing ? -beat * U : -attractBeat * U * 0.8;
  shake = Math.max(0, shake - dt * 2.5);
  cam.position.set(Math.sin(beat * 0.39) * 0.35 + (Math.random() - 0.5) * shake * 0.25, 1.7 + Math.sin(beat * Math.PI) * 0.03 + (Math.random() - 0.5) * shake * 0.2, z);
  cam.rotation.set(-0.02 + Math.sin(beat * 0.27) * 0.015, Math.sin(beat * 0.21) * 0.03, Math.sin(beat * 0.33) * 0.02);
  recycle(cam.position.z);
  if (skyGroup) skyGroup.position.set(cam.position.x, 0, cam.position.z);
  sunL.position.set(cam.position.x - 6, 12, cam.position.z - 10); sunL.target.position.set(cam.position.x, 0, cam.position.z);
  if (motes) { motes.position.z = Math.floor(cam.position.z / 60) * 60; }
  // music pulse: neon flashes on every kick, gates flash on bar starts
  const sec = playing && song ? song.order[Math.max(0, Math.floor(beat / 8)) % song.order.length] : 'V';
  const kickOn = !playing || (SEC[sec] && SEC[sec].kick && beat >= 0);
  const pulse = kickOn ? Math.pow(1 - frac, 3) : 0.25 * (1 - frac);
  const barPulse = Math.pow(1 - ((beat / 4) % 1 + 1) % 1, 4);
  const drop = playing && sec === 'D' ? 1 : 0;
  neonMat.color.setScalar(0.65 + pulse * 0.7 + barPulse * 0.3 * drop);
  winMat.color.setScalar(0.75 + pulse * 0.25 * (0.5 + drop));
  gunNeon.color.set(PAL.neonB).multiplyScalar(0.7 + pulse * 0.6);

  // aim (keys / d-pad)
  if (state === 'play' && inMode === 'keys') {
    const sp = 1.1 * dt * Math.min(innerWidth, innerHeight);
    let ax = (keysHeld[39] ? 1 : 0) - (keysHeld[37] ? 1 : 0), ay = (keysHeld[40] ? 1 : 0) - (keysHeld[38] ? 1 : 0);
    if (ax || ay) setAimPx(aim.px + ax * sp, aim.py + ay * sp, false);
  }
  // enemies
  if (playing && song) {
    while (chart.length && chart[0].sb - 0.25 <= beat) spawn(chart.shift());
    for (let i = live.length - 1; i >= 0; i--) {
      const e = live[i];
      if (e.state !== 'live') { live.splice(i, 1); continue; }
      const age = beat - e.sb; e.g.scale.setScalar(Math.min(1, Math.max(0.01, (age + 0.25) / 0.5)));
      e.knock = Math.max(0, e.knock - dt * 6);
      const bob = Math.abs(Math.sin(beat * Math.PI)) * 0.08;
      e.g.position.set(e.x, e.y + (e.kind === 'd' ? Math.sin(beat * 1.6 + e.x) * 0.3 : bob), e.z - e.knock * 0.3);
      e.g.rotation.y = Math.atan2(cam.position.x - e.x, cam.position.z - e.z);
      e.g.rotation.z = e.kind === 'd' ? Math.sin(beat * 2) * 0.15 : Math.sin(beat * Math.PI) * 0.06;
      e.center.set(e.g.position.x, e.g.position.y + e.cy, e.g.position.z);
      const nf = e.fires.find(f => f > beat - 0.01);
      const tele = nf !== undefined && nf - beat < 0.5;
      e.visor.material = tele ? visorHot : visorMat;
      if (e.arm) { const raise = nf !== undefined && nf - beat < 1.2 ? 1 : 0.35; e.arm.rotation.x += ((-Math.PI / 2) * raise - e.arm.rotation.x) * Math.min(1, dt * 10); }
      if (e.kind === 'd' && e.visor) e.visor.rotation.y = beat * 2;
      e.body.material = e.flash > 0 ? flashMat : enemyMat; e.flash -= dt;
      while (e.nextFire < e.fires.length && beat >= e.fires[e.nextFire]) { if (beat - e.fires[e.nextFire] < 0.5) fireBullet(e, e.fires[e.nextFire]); e.nextFire++; }
      if (age >= LEAD - 0.6) { e.state = 'gone'; stats.escaped++; stats.combo = 0; stats.mult = 1; scene.remove(e.g); updateHud(); }
    }
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      if (!b.alive) { bullets.splice(i, 1); continue; }
      const t = (beat - b.fb) / (b.ab - b.fb);
      b.g.position.lerpVectors(b.from, b.to, Math.max(0, t)); b.core.rotation.set(beat * 5, beat * 7, 0);
      if (t >= 1) { b.alive = false; scene.remove(b.g); bullets.splice(i, 1); hurt(); updateHud(); }
    }
    // shield regenerates after 16 clean beats
    if (state === 'play') { stats.regen += dt / spb(); if (stats.regen > 16 && stats.shield < 3) { stats.shield++; stats.regen = 0; updateHud(); } }
    $('prog').firstChild.style.width = Math.min(100, Math.max(0, beat / (run ? run.totalBars * 4 : 1) * 100)) + '%';
    if (state === 'play' && run && beat > run.totalBars * 4 + 3) endSong();
    if (AUTOPLAY && state === 'play') autoTick(beat);
  }
  // particles / fx
  for (const s of shards) if (s.life > 0) { s.life -= dt; s.v.y -= 9 * dt; s.mesh.position.addScaledVector(s.v, dt); s.mesh.rotation.x += s.spin.x * dt; s.mesh.rotation.y += s.spin.y * dt;
    if (s.mesh.position.y < 0.05) { s.mesh.position.y = 0.05; s.v.y *= -0.35; s.v.x *= 0.7; s.v.z *= 0.7; }
    s.mesh.scale.multiplyScalar(s.life < 0.3 ? 0.9 : 1); if (s.life <= 0) s.mesh.visible = false; }
  for (const b of bursts) if (b.life > 0) { b.life -= dt; const k = Math.max(0, b.life / b.max); b.spr.scale.setScalar(b.size * (1.4 - k * 0.4)); b.spr.material.opacity = k; if (b.life <= 0) b.spr.visible = false; }
  for (const t of tracers) { t.life -= dt; t.line.material.opacity = Math.max(0, t.life / 0.09); }
  dmgFlash = Math.max(0, dmgFlash - dt * 2.2); $('dmg').style.opacity = dmgFlash;
  for (const p of pops) if (p.life > 0) { p.life -= dt; const k = p.life / 0.8; p.el.style.opacity = Math.min(1, k * 2.5);
    p.el.style.transform = 'translate(' + (p.x - 40) + 'px,' + (p.y - (1 - k) * 40) + 'px) scale(' + (0.8 + Math.min(0.4, (1 - k) * 2)) + ')'; if (p.life <= 0) p.el.style.opacity = 0; }
  // gun follows the reticle
  gun.visible = state === 'play' || state === 'paused';
  if (gun.visible) {
    _ndc.set(aim.x, aim.y); ray.setFromCamera(_ndc, cam); ray.ray.at(25, _wt); gun.lookAt(_wt);
    gunState.recoil = Math.max(0, gunState.recoil - dt * 9);
    gunKick.rotation.x = -gunState.recoil * 0.4; gunKick.position.z = -gunState.recoil * 0.06;
    muzzleT -= dt; muzzle.scale.setScalar(muzzleT > 0 ? 0.35 : 0.0001); muzzle.material.color.set(PAL.neonB);
    gunLight.intensity = muzzleT > 0 ? 3 : 0; gunLight.color.set(PAL.neonB);
    const ret = $('reticle'); ret.style.transform = 'translate(' + aim.px + 'px,' + aim.py + 'px) scale(' + (1 + pulse * 0.15) + ')';
    const over = state === 'play' && pickTarget(tolerance()); ret.className = over ? 'lock' : '';
  }
  R.render(scene, cam);
}

// ---------- autoplay (tests): aims at the next target and fires on the 8th-note grid ----------
let autoLast = -1;
function autoTick(beat) {
  const step = Math.floor(beat * 2); if (step === autoLast) return; autoLast = step;
  let target = null, best = 1e9;
  for (const b of bullets) if (b.alive && b.ab - beat < best) { best = b.ab - beat; target = b.g.position; }
  if (!target || best > 1.2) for (const e of live) if (e.state === 'live' && e.g.scale.x > 0.9) { const due = e.sb + 2 - beat; if (due < best) { best = due; target = e.center; } }
  if (!target) return;
  _pp.copy(target).project(cam); setAimPx((_pp.x + 1) / 2 * innerWidth, (1 - _pp.y) / 2 * innerHeight, false); fire();
}

// ---------- boot ----------
buildWorld(0); buildEnemyGeos(PAL); applyPalMats(); renderSongs(); ctlLabel(); hintText(); showOnly('title');
requestAnimationFrame(frame);
window.__pr = { get state() { return state; }, stats, startSong, fire, setAim: setAimPx, get beat() { return songBeat(); }, get profile() { return PROFILE; },
  get live() { return live.length; }, get bullets() { return bullets.length; }, get chartLeft() { return chart.length; }, songs: SONGS, end: () => { if (run) { run.t0 -= 1e4; } } };
</script>
</body>
