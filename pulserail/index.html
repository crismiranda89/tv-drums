<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#2a1a4a">
<title>Pulse Rail · who's playing?</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{font-family:"Arial Rounded MT Bold","Nunito","Quicksand",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;
    background:linear-gradient(160deg,#ffd36e 0%,#ff8fb8 38%,#8a6cff 72%,#1b1f4a 100%);display:flex;flex-direction:column;align-items:center;justify-content:center}
  h1{margin:0 0 4vh;font-size:6vh;letter-spacing:.02em;text-shadow:0 .5vh 0 #b04ad0,0 1vh 2vh rgba(0,0,0,.25)}
  .cards{display:flex;align-items:stretch}.cards .card+.card{margin-left:5vw}
  .card{width:36vw;max-width:640px;border-radius:3.2vh;padding:2.6vh;cursor:pointer;outline:none;border:.7vh solid transparent;
    transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;display:flex;flex-direction:column;align-items:center;text-align:center}
  .card:focus,.card:hover{transform:scale(1.05);border-color:#fff;box-shadow:0 0 0 .6vh rgba(255,255,255,.35),0 2vh 5vh rgba(0,0,0,.35)}
  .kids{background:linear-gradient(180deg,#7fd4ff,#5aa8ff);color:#123}
  .adults{background:linear-gradient(180deg,#141428,#05050c);color:#dff}
  .pic{width:100%;height:18.5vw;border-radius:2vh;overflow:hidden;position:relative;background:#000}
  .pic img{width:100%;height:100%;object-fit:cover;display:block}
  .neon{background:radial-gradient(circle at 50% 120%,#ff2bd6 0%,transparent 55%),radial-gradient(circle at 20% 0%,#2be8ff55 0%,transparent 50%),#090914;display:flex;align-items:center;justify-content:center}
  .neon .lock{font-size:12vh;filter:drop-shadow(0 0 2vh #3de8ff)}
  .age{position:absolute;top:1.4vh;right:1.4vh;font-size:4.2vh;font-weight:900;padding:.4vh 1.6vh;border-radius:999px}
  .kids .age{background:#ffe14d;color:#a03;box-shadow:0 .4vh 0 #e0a000}
  .adults .age{background:#ff2b5a;color:#fff;box-shadow:0 0 2vh #ff2b5a}
  .name{font-size:5.4vh;font-weight:900;margin:2vh 0 .6vh}
  .kids .name{color:#fff;text-shadow:0 .4vh 0 #3a78d8}
  .adults .name{color:#3de8ff;text-shadow:0 0 2vh #3de8ff}
  .sub{font-size:2.6vh;opacity:.85}
  .hint{margin-top:4vh;font-size:2.2vh;opacity:.8}
  /* PIN */
  #pin{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,8,30,.82);display:flex;align-items:center;justify-content:center}
  #pin.hidden{display:none}
  .box{background:#0d0d1e;border:.4vh solid #3de8ff55;border-radius:3vh;padding:4vh 5vh;text-align:center;box-shadow:0 0 6vh #3de8ff33}
  .q{font-size:4vh;font-weight:900;color:#3de8ff;margin-bottom:1vh}
  .qs{font-size:2.3vh;color:#9ab;margin-bottom:3vh}
  .shown{display:flex;justify-content:center;margin-bottom:3vh;min-height:9vh}
  .dig{margin:0 .7vh;width:7vh;height:9vh;border-radius:1.4vh;background:#1a1a33;border:.3vh solid #3de8ff66;font-size:6vh;font-weight:900;line-height:8.4vh}
  .dig.empty{opacity:.35}
  .pad{display:grid;grid-template-columns:repeat(3,10vh);grid-gap:1.4vh;justify-content:center}
  .k{height:8.5vh;border-radius:1.6vh;border:.35vh solid transparent;background:#1d1d3a;color:#fff;font:inherit;font-size:4.4vh;font-weight:900;cursor:pointer;outline:none}
  .k:focus,.k:hover{border-color:#fff;background:#2b2b5a;transform:scale(1.06)}
  .k.ok{background:#1b8f5a}.k.del{background:#5a1d2b}
  .msg{height:3.6vh;margin-top:2vh;font-size:2.6vh;color:#ff8fa8}
  .shake{animation:sh .4s}
  @keyframes sh{0%,100%{transform:none}20%,60%{transform:translateX(-2vh)}40%,80%{transform:translateX(2vh)}}
  .go{color:#6dffb0!important}
</style></head>
<body>
<h1>Who's playing?</h1>
<div class="cards">
  <div class="card kids f" id="kids" tabindex="0">
    <div class="pic"><img src="kids.jpg" alt=""><div class="age">3+</div></div>
    <div class="name">Kids</div>
    <div class="sub">Pop the Boppers in the candy town</div>
  </div>
  <div class="card adults f" id="adults" tabindex="0">
    <div class="pic neon"><div class="lock">🔒</div><div class="age">16+</div></div>
    <div class="name">Grown-ups</div>
    <div class="sub">Pulse Rail · needs the PIN</div>
  </div>
</div>
<div class="hint">Point and click, or use ◀ ▶ and OK</div>

<div id="pin" class="hidden"><div class="box" id="pinBox">
  <div class="q">What is the meaning of the universe?</div>
  <div class="qs">Grown-ups only. Type the answer with the number keys.</div>
  <div class="shown" id="shown"></div>
  <div class="pad" id="pad"></div>
  <div class="msg" id="msg"></div>
</div></div>

<script>
// Pulse Rail landing: Kids opens the kids edition, Grown-ups asks a little quiz PIN (42) and opens the full game.
// It is a gate for small children, not security: the answer lives in this page.
var ANSWER = '42', KIDS = '../pulserail-kids/', ADULTS = 'play.html';
var $ = function (id) { return document.getElementById(id); };
var entry = '', pinOpen = false;

function go(url) { location.href = url; }
$('kids').onclick = function () { go(KIDS); };
$('adults').onclick = openPin;

// keypad
var keys = ['1','2','3','4','5','6','7','8','9','⌫','0','OK'];
keys.forEach(function (t) {
  var b = document.createElement('button'); b.className = 'k f' + (t === 'OK' ? ' ok' : t === '⌫' ? ' del' : ''); b.textContent = t;
  b.onclick = function (e) { e.stopPropagation(); press(t); };
  $('pad').appendChild(b);
});
function draw() {
  var h = '', n = Math.max(2, entry.length);
  for (var i = 0; i < n; i++) h += '<div class="dig' + (entry[i] ? '' : ' empty') + '">' + (entry[i] || '·') + '</div>';
  $('shown').innerHTML = h;
}
function press(t) {
  if (t === '⌫') { entry = entry.slice(0, -1); $('msg').textContent = ''; }
  else if (t === 'OK') { check(true); return; }
  else if (entry.length < 4) { entry += t; $('msg').textContent = ''; }
  draw(); check(false);
}
function check(final) {
  if (entry === ANSWER) { $('msg').className = 'msg go'; $('msg').textContent = 'Correct! Don\'t panic…'; setTimeout(function () { go(ADULTS); }, 450); return; }
  if (final || entry.length >= 4) {
    $('msg').className = 'msg'; $('msg').textContent = entry ? 'Not quite! Ask a grown-up.' : 'Type the answer first';
    var b = $('pinBox'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
    entry = ''; draw();
  }
}
function openPin() { entry = ''; draw(); $('msg').textContent = ''; pinOpen = true; $('pin').classList.remove('hidden'); setTimeout(function () { $('pad').children[0].focus(); }, 30); }
function closePin() { pinOpen = false; $('pin').classList.add('hidden'); $('adults').focus(); }
$('pin').onclick = function (e) { if (e.target === $('pin')) closePin(); };

// remote: arrows move focus to the nearest button that way, OK clicks, digits type, Back closes
function scope() { return pinOpen ? $('pad').querySelectorAll('.f') : document.querySelectorAll('.cards .f'); }
function move(dx, dy) {
  var list = scope(), cur = document.activeElement, best = null, bd = 1e9;
  if ([].indexOf.call(list, cur) < 0) { list[0].focus(); return; }
  var a = cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  for (var i = 0; i < list.length; i++) {
    var el = list[i]; if (el === cur) continue;
    var r = el.getBoundingClientRect(), x = r.left + r.width / 2 - ax, y = r.top + r.height / 2 - ay;
    var along = x * dx + y * dy; if (along <= 1) continue;
    var d = along + Math.abs(x * dy + y * dx) * 2; if (d < bd) { bd = d; best = el; }
  }
  if (best) best.focus();
}
addEventListener('keydown', function (e) {
  var k = e.keyCode;
  if (k === 37) { e.preventDefault(); move(-1, 0); }
  else if (k === 39) { e.preventDefault(); move(1, 0); }
  else if (k === 38) { e.preventDefault(); move(0, -1); }
  else if (k === 40) { e.preventDefault(); move(0, 1); }
  else if (k === 13) { e.preventDefault(); var el = document.activeElement; if (el && el.click && el !== document.body) el.click(); else scope()[0].focus(); }
  else if (pinOpen && ((k >= 48 && k <= 57) || (k >= 96 && k <= 105))) { e.preventDefault(); press(String((k - 48) % 48 % 10)); }
  else if (k === 461 || k === 10009 || k === 27 || k === 8) {
    if (pinOpen) { e.preventDefault(); if (k === 8 && entry) press('⌫'); else closePin(); }
  }
});
draw();
setTimeout(function () { $('kids').focus(); }, 50);
</script>
</body></html>
