<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05050a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Drums</title>
<style>
  :root{--hh:#ffc83d;--sn:#3ddcff;--tm:#ff3d8b;--ink:#f4f5ff;--dim:rgba(232,236,255,.62)}
  html,body{margin:0;height:100%;background:#05050a;overflow:hidden;color:var(--ink);
    font-family:system-ui,-apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  body.stick,body.stick *{cursor:none!important}
  #gl{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;display:block;touch-action:none}
  button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}

  /* ---------- HUD ---------- */
  #hud{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .4s}
  #hud.on{opacity:1}
  #prog{position:absolute;left:0;right:0;top:0;height:3px;background:rgba(255,255,255,.07)}
  #prog i{display:block;position:relative;height:100%;width:0;background:linear-gradient(90deg,var(--hh),var(--sn),var(--tm));box-shadow:0 0 14px rgba(255,255,255,.55)}
  #scoreBox{position:absolute;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}
  #score{font:900 italic 46px/1 system-ui,sans-serif;letter-spacing:.01em;font-variant-numeric:tabular-nums;
    text-shadow:0 0 22px rgba(120,190,255,.45),0 3px 0 rgba(0,0,0,.45)}
  #prog i::after{content:'';position:absolute;right:-6px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:#fff;box-shadow:0 0 12px 3px rgba(255,255,255,.8)}
  #score.bump{animation:bump .22s ease-out}
  @keyframes bump{40%{transform:scale(1.12)}}
  #combo{font:800 12px/1 system-ui;letter-spacing:.32em;color:var(--dim);margin-top:7px;min-height:12px}
  #combo b{color:#fff;font-size:15px;letter-spacing:.06em;margin-right:6px}
  #mult{position:absolute;top:max(12px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));width:68px;height:68px}
  #mult svg{position:absolute;top:0;right:0;bottom:0;left:0;transform:rotate(-90deg);overflow:visible}
  #mult circle{fill:none;stroke-width:6}
  #mult .bg{stroke:rgba(255,255,255,.12)}
  #mult .fg{stroke:#fff;stroke-linecap:round;stroke-dasharray:201;stroke-dashoffset:201;transition:stroke-dashoffset .15s,stroke .3s;filter:drop-shadow(0 0 6px currentColor)}
  #mult span{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;font:900 italic 25px/1 system-ui;text-shadow:0 0 14px currentColor}
  #mult.up{animation:multUp .45s cubic-bezier(.2,1.6,.4,1)}
  #mult.brk{animation:shake .35s}
  @keyframes multUp{0%{transform:scale(1)}35%{transform:scale(1.35)}100%{transform:scale(1)}}
  @keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
  #songName{position:absolute;top:max(22px,calc(env(safe-area-inset-top) + 8px));right:max(70px,calc(env(safe-area-inset-right) + 64px));
    font:800 11px/1.3 system-ui;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);text-align:right}
  #pauseBtn{position:fixed;z-index:4;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;
    border:1px solid rgba(255,255,255,.16);background:rgba(16,16,26,.5);color:#fff;font:900 15px system-ui;letter-spacing:-1px;display:none;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  #pauseBtn.on{display:block}
  .jd{position:fixed;z-index:3;left:0;top:0;pointer-events:none;font:900 italic 34px/1 system-ui;letter-spacing:.06em;white-space:nowrap;opacity:0;
    transform:translate(-50%,-50%)}
  .jd.go{animation:jd .55s cubic-bezier(.2,1.4,.4,1) forwards}
  .jd.perf{background:linear-gradient(180deg,#fffbe0,#ffc83d);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;-webkit-text-stroke:2px rgba(0,0,0,.45);filter:drop-shadow(0 0 12px rgba(255,200,61,.8))}
  .jd.mis{font-size:26px}
  .jd.mis.go{animation:jdMiss .6s ease-out forwards}
  @keyframes jdMiss{0%{opacity:0;transform:translate(-50%,-70%)}20%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,0%)}}
  @keyframes jd{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1;transform:translate(-50%,-70%) scale(1)}100%{opacity:0;transform:translate(-50%,-95%) scale(.95)}}
  .pop{position:fixed;z-index:3;left:0;top:0;pointer-events:none;font:900 italic 20px/1 system-ui;white-space:nowrap;will-change:transform,opacity}
  #center{position:fixed;top:0;right:0;bottom:0;left:0;z-index:5;display:grid;place-items:center;pointer-events:none}
  #center div{font:900 italic min(26vw,150px)/1 system-ui;letter-spacing:-.02em;opacity:0}
  #center div.go{animation:big .7s cubic-bezier(.2,1.3,.4,1) forwards}
  #center div.sm{font-size:min(12vw,72px)}
  @keyframes big{0%{opacity:0;transform:scale(1.8)}25%{opacity:1;transform:scale(1)}75%{opacity:1;transform:scale(.96)}100%{opacity:0;transform:scale(.9)}}
  #vig{position:fixed;top:0;right:0;bottom:0;left:0;z-index:2;pointer-events:none;opacity:0;box-shadow:inset 0 0 140px 36px rgba(255,30,60,.6);transition:opacity .35s}
  #vig.on{opacity:1;transition:none}

  /* ---------- overlays ---------- */
  .ov{position:fixed;top:0;right:0;bottom:0;left:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;
    padding:max(24px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));box-sizing:border-box;
    background:radial-gradient(ellipse at 50% 45%,rgba(8,6,18,.45),rgba(3,3,8,.9))}
  .ov.show{display:flex;animation:fade .35s ease-out}
  @keyframes fade{from{opacity:0}}
  #title{background:linear-gradient(180deg,rgba(3,3,8,.72) 0%,rgba(3,3,8,.1) 38%,rgba(3,3,8,0) 55%,rgba(3,3,8,.75) 100%);justify-content:space-between}
  .logo{font:900 italic min(24vw,132px)/.86 'Avenir Next Condensed','Futura','Impact','Arial Black',system-ui;letter-spacing:-.01em;margin:0;transform:skewX(-6deg);
    background:linear-gradient(100deg,var(--hh) 0%,#ff8a3d 35%,var(--tm) 60%,var(--sn) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 30px rgba(255,61,139,.35))}
  .tag{font:800 12px/1.4 system-ui;letter-spacing:.42em;text-transform:uppercase;color:var(--dim);margin-top:10px}
  .ov p{font-size:15px;max-width:440px;margin:0;line-height:1.5;color:var(--dim)}
  .btn{font:800 16px/1 system-ui;letter-spacing:.14em;text-transform:uppercase;color:#fff;padding:17px 30px;border-radius:16px;
    border:1px solid rgba(255,255,255,.16);background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.04));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 12px 32px rgba(0,0,0,.4);transition:transform .15s,border-color .15s,box-shadow .15s}
  .btn.primary{border:none;background:linear-gradient(135deg,#ff3d8b,#ff8a3d);box-shadow:0 12px 40px rgba(255,61,139,.45),inset 0 1px 0 rgba(255,255,255,.35)}
  .btn:hover,.btn:focus-visible,.btn.kf{transform:scale(1.05);border-color:#fff;outline:none;box-shadow:0 0 0 3px rgba(255,255,255,.85),0 14px 40px rgba(0,0,0,.45)}
  .btn.big{font-size:20px;padding:22px 64px;border-radius:20px}
  #startBtn{animation:breathe 1.2s ease-in-out infinite alternate}
  @keyframes breathe{from{box-shadow:0 12px 40px rgba(255,61,139,.45),inset 0 1px 0 rgba(255,255,255,.35)}to{box-shadow:0 12px 60px rgba(255,61,139,.8),0 0 0 6px rgba(255,61,139,.18),inset 0 1px 0 rgba(255,255,255,.35)}}
  .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  h2{font:900 italic 34px/1 system-ui;letter-spacing:-.01em;margin:0}
  .eyebrow{font:800 11px/1 system-ui;letter-spacing:.4em;text-transform:uppercase;color:var(--dim)}
  #songs{display:flex;flex-direction:column;gap:12px;width:min(560px,94vw)}
  .song{display:grid;grid-template-columns:8px 1fr auto;gap:0 16px;align-items:center;text-align:left;color:#fff;padding:16px 18px 16px 0;border-radius:18px;overflow:hidden;
    border:1px solid rgba(255,255,255,.12);background:linear-gradient(100deg,rgba(30,30,44,.86),rgba(14,14,22,.82));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .15s,border-color .15s,box-shadow .15s}
  .song:hover,.song:focus-visible,.song.kf{transform:scale(1.025);border-color:#fff;outline:none;box-shadow:0 0 0 3px rgba(255,255,255,.85),0 14px 40px rgba(0,0,0,.45)}
  .song .bar{align-self:stretch;margin:-16px 0}
  .song .nm{font:900 italic 22px/1.1 system-ui}
  .song .mt{font:700 12px/1 system-ui;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:7px}
  .song .bs{text-align:right;font:800 12px/1.2 system-ui;letter-spacing:.12em;color:var(--dim)}
  .song .bs b{display:block;font:900 italic 26px/1 system-ui;letter-spacing:0;color:#fff;margin-bottom:3px}
  .seg{display:inline-flex;border:1px solid rgba(255,255,255,.16);border-radius:14px;overflow:hidden}
  .seg button{font:800 12px/1 system-ui;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);background:transparent;border:0;padding:13px 16px}
  .seg button.on{background:rgba(255,255,255,.16);color:#fff}
  .seg button:focus-visible,.seg button.kf{outline:2px solid #fff;outline-offset:-2px}
  .opt{display:flex;align-items:center;gap:12px;font:800 11px/1 system-ui;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
  #grade{font:900 italic min(40vw,170px)/.85 system-ui;margin:0;background-clip:text;-webkit-background-clip:text;color:transparent}
  #rScore{font:900 italic 48px/1 system-ui;font-variant-numeric:tabular-nums}
  #newBest{font:900 12px/1 system-ui;letter-spacing:.3em;color:#05050a;background:var(--hh);padding:7px 12px;border-radius:8px;display:none}
  #newBest.on{display:inline-block;animation:multUp .6s}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(520px,92vw)}
  .stats div{padding:12px 6px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
  .stats b{display:block;font:900 italic 24px/1 system-ui;margin-bottom:6px}
  .stats span{font:800 10px/1 system-ui;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
  .hint{font:700 13px/1.5 system-ui;color:var(--dim);max-width:480px}
  .hint b{color:#fff}
  /* phone: no song name (it collides with the score), smaller score, pause under the multiplier, speed + free play on own rows */
  @media (max-width:600px){
    #songName{display:none}
    #score{font-size:clamp(30px,9vw,46px)}
    #mult{width:56px;height:56px} #mult span{font-size:21px}
    #pauseBtn{bottom:auto;top:max(20px,calc(env(safe-area-inset-top) + 8px));left:max(78px,calc(env(safe-area-inset-left) + 78px));width:40px;height:40px;font-size:13px}
    #select .row{flex-direction:column;gap:14px}
    .pop{font-size:18px}
  }
  /* TV / landscape: song list on the left, kit visible on the right */
  @media (min-width:1000px) and (min-aspect-ratio:4/3){
    #select{align-items:flex-start;padding-left:6vw;background:linear-gradient(90deg,rgba(3,3,8,.88) 0%,rgba(3,3,8,.6) 38%,rgba(3,3,8,0) 62%)}
    #select .row{justify-content:flex-start}
    #songs{width:min(620px,42vw)}
    #title{align-items:flex-start;justify-content:center;gap:5vh;padding-left:6vw;text-align:left;background:linear-gradient(90deg,rgba(3,3,8,.85) 0%,rgba(3,3,8,.5) 34%,rgba(3,3,8,0) 58%)}
    #title > div{margin:0!important;align-items:flex-start!important}
    #results{background:radial-gradient(ellipse at 50% 45%,rgba(3,3,8,.75),rgba(3,3,8,.94))}
  }
  @media (min-width:1280px){
    #score{font-size:72px} #combo{font-size:22px;margin-top:10px} #combo b{font-size:26px}
    #mult{width:96px;height:96px} #mult span{font-size:34px}
    #songName{font-size:13px;text-align:center;right:auto;left:50%;transform:translateX(-50%);top:auto;bottom:28px}
    #scoreBox::before{content:'';position:absolute;z-index:-1;left:-140px;right:-140px;top:-30px;bottom:-30px;background:radial-gradient(ellipse at 50% 45%,rgba(3,3,8,.7),rgba(3,3,8,0) 70%)}
    #prog{height:5px}
    .jd{font-size:44px} .jd.mis{font-size:32px}
    #results{zoom:1.4}
  }
  #rBreak{font:800 12px/1 system-ui;letter-spacing:.18em;color:var(--dim);display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
  #rBreak b{font:900 italic 16px/1 system-ui;letter-spacing:0;margin-right:6px}
  #grade.slam{animation:slam .55s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes slam{0%{transform:scale(2.4);opacity:0;filter:brightness(3)}45%{transform:scale(.94);opacity:1}100%{transform:scale(1);filter:brightness(1)}}
  .stats div{opacity:0;transform:translateY(14px);transition:opacity .35s,transform .35s cubic-bezier(.2,1.4,.4,1)}
  .stats.in div{opacity:1;transform:none}
  .stats.in div:nth-child(2){transition-delay:.08s} .stats.in div:nth-child(3){transition-delay:.16s} .stats.in div:nth-child(4){transition-delay:.24s}
  #mult.hot{box-shadow:0 0 26px 4px rgba(255,200,61,.55);border-radius:50%;animation:hot .5s ease-in-out infinite alternate}
  @keyframes hot{to{box-shadow:0 0 40px 10px rgba(255,140,61,.7)}}
  @media (max-height:560px){.logo{font-size:min(14vw,80px)} .btn.big{padding:16px 48px} #songs{gap:8px} .song{padding:10px 16px 10px 0} .song .nm{font-size:18px}}
  /* old TV browsers (Chromium < 84) ignore flex gap: html.nogap gets margins instead */
  .nogap .ov>*+*{margin-top:16px} .nogap #songs>*+*{margin-top:12px} .nogap .row>*{margin:6px}
  .nogap .opt>*+*{margin-left:12px} .nogap #rBreak>*+*{margin-left:18px}
  .tv *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  .tv #mult .fg,.tv .jd.perf{filter:none} .tv #startBtn,.tv #mult.hot{animation:none}
  #fps{position:fixed;z-index:20;right:max(10px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));
    font:600 12px/1 ui-monospace,Menlo,monospace;color:rgba(200,200,210,.45);cursor:pointer;user-select:none;letter-spacing:.02em}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="fps" title="click: change graphics profile"></div>
<div id="vig"></div>

<div id="hud">
  <div id="prog"><i></i></div>
  <div id="mult"><svg viewBox="0 0 68 68"><circle class="bg" cx="34" cy="34" r="32"/><circle class="fg" cx="34" cy="34" r="32"/></svg><span>×1</span></div>
  <div id="scoreBox"><div id="score">0</div><div id="combo"></div></div>
  <div id="songName"></div>
</div>
<div class="jd" id="jd0"></div><div class="jd" id="jd1"></div><div class="jd" id="jd2"></div>
<div id="center"><div id="big"></div></div>
<button id="pauseBtn" aria-label="Pause">II</button>

<div id="title" class="ov show">
  <div style="margin-top:6vh">
    <h1 class="logo">DRUMS</h1>
    <div class="tag">Hit the rings as they land</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:4vh">
    <button class="btn primary big" id="startBtn">Play</button>
    <div class="hint" id="titleHint">Tap a drum when its ring lands on it.</div>
  </div>
</div>

<div id="select" class="ov">
  <div class="eyebrow">Choose a track</div>
  <div id="songs"></div>
  <div class="row" style="margin-top:6px;align-items:center">
    <div class="opt">Note speed <div class="seg" id="speedSeg"></div></div>
    <button class="btn" id="freeBtn">Free play</button>
  </div>
</div>

<div id="pause" class="ov">
  <h2>Paused</h2>
  <div class="row" style="flex-direction:column;align-items:stretch;width:min(320px,86vw)">
    <button class="btn primary" id="resumeBtn">Resume</button>
    <button class="btn" id="restartBtn">Restart</button>
    <button class="btn" id="quitBtn">Song list</button>
  </div>
  <div class="row" id="freeRow" style="display:none"><button class="btn" id="jamBtn">Backing beat: off</button></div>
</div>

<div id="results" class="ov">
  <div class="eyebrow" id="rSong"></div>
  <div id="grade">S</div>
  <div id="rScore">0</div>
  <div id="newBest">NEW BEST</div>
  <div class="stats">
    <div><b id="rAcc">0%</b><span>Accuracy</span></div>
    <div><b id="rCombo">0</b><span>Max combo</span></div>
    <div><b id="rPerf">0</b><span>Notes hit</span></div>
    <div><b id="rMiss">0</b><span>Best</span></div>
  </div>
  <div id="rBreak"></div>
  <div class="row"><button class="btn primary" id="retryBtn">Play again</button><button class="btn" id="songsBtn">Song list</button></div>
</div>

<script src="three-0.160.0.min.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const AUTO = /[?&]autoplay\b/.test(location.search);   // demo / attract mode: the game plays itself

// ================= data =================
const LANES = [
  { id: 'hihat', name: 'Hi-Hat',    color: 0xffb020, css: '#ffc83d', keys: ['1', 'a', 'j', 'ArrowLeft'] },
  { id: 'snare', name: 'Snare',     color: 0x3ddcff, css: '#3ddcff', keys: ['2', 's', 'k', 'ArrowDown', 'ArrowUp', ' '] },
  { id: 'tom',   name: 'Floor Tom', color: 0xff3d8b, css: '#ff3d8b', keys: ['3', 'd', 'l', 'ArrowRight'] },
];
// Charts: one character per 16th note — h = hi-hat, s = snare, t = tom, . = rest.
// One drum at a time, so a single pointer can play every chart.
const SONGS = [
  { id: 'warmup', name: 'Warm Up', bpm: 84, level: 1, key: 45, prog: [[0, 'm'], [8, 'M'], [3, 'M'], [10, 'M']],
    kick: 'x.......x.......', bass: 'x.......x...x...', arp: false,
    pat: { A: 'h...s...h...s...', B: 'h...s...t...s...', C: 't...s...t...s...', D: 's...s...t...t...' },
    order: 'AAAB AAAB CCAB AADD AAAB' },
  { id: 'backbeat', name: 'Backbeat', bpm: 96, level: 2, key: 40, prog: [[0, 'm'], [10, 'M'], [8, 'M'], [10, 'M']],
    kick: 'x.....x.x.......', bass: 'x.....x.x...x...', arp: false,
    pat: { A: 'h.h.s...h.h.s...', B: 'h.h.s...h.t.s...', C: 't.t.s...t.t.s...', F: 's.s.t.t.s...t...' },
    order: 'AAAB AAAB CCAB AAFF AAAB AACF' },
  { id: 'thunder', name: 'Tom Thunder', bpm: 108, level: 3, key: 38, prog: [[0, 'm'], [5, 'm'], [10, 'M'], [7, 'M']],
    kick: 'x.....x...x.....', bass: 'x.x...x.o.x...5.', arp: true,
    pat: { A: 'h.h.s.h.h.h.s.h.', B: 'h.h.s.h.t.t.s.h.', C: 't.h.s.h.t.h.s.h.', F: 't.t.s.s.t.t.s.s.', G: 's.t.s.t.s.t.t.t.' },
    order: 'AAAB AAAF CCCB CCGF AABB AAGF AABF' },
  { id: 'funk', name: 'Neon Funk', bpm: 116, level: 4, key: 43, prog: [[0, 'm'], [5, 'M'], [0, 'm'], [5, 'M']],
    kick: 'x..x..x...x..x..', bass: 'x..o..x.5.x..o.x', arp: true,
    pat: { A: 'h.hs.h.hh.hs.h.h', B: 'h.hs.h.ht.ts.t.h', C: 't.ts.t.th.hs.h.t', F: 's.st.ts.s.tt.s.h' },
    order: 'AAAB AAAB CCAF AABF CCCB AABF AAFF' },
];
const LEVELS = ['', 'Easy', 'Medium', 'Hard', 'Expert'];
const SPEEDS = [{ n: 'Slow', v: 2.2 }, { n: 'Normal', v: 1.7 }, { n: 'Fast', v: 1.25 }];
const W_PERF = 0.05, W_GREAT = 0.095, W_GOOD = 0.145;   // timing windows (seconds, either side)
const PTS = { perfect: 100, great: 70, good: 40 };
const PER_TIER = 8, MAX_MULT = 4;

const S = Object.assign({ speed: 1 }, JSON.parse(localStorage.getItem('bateria.s') || '{}'));
if (!SPEEDS[S.speed]) S.speed = 1;
const BEST = JSON.parse(localStorage.getItem('bateria.best') || '{}');
const save = () => { localStorage.setItem('bateria.s', JSON.stringify(S)); localStorage.setItem('bateria.best', JSON.stringify(BEST)); };

function buildDrum({ r, depth, shellMat, lugs = 8, head, bead }) {

    new THREE.MeshStandardMaterial({ color: 0x4a3524, roughness: 0.9, side: THREE.BackSide })));
  const headMat = new THREE.MeshPhysicalMaterial({ map: head, roughness: 0.72, clearcoat: MOBILE ? 0 : 0.2, clearcoatRoughness: 0.5, emissive: 0x000000 });

  hd.rotation.x = -Math.PI / 2; hd.position.y = depth / 2 + 0.006; hd.receiveShadow = true; g.add(hd);
  const bot = new THREE.Mesh(new THREE.CircleGeometry(r, 48), new THREE.MeshStandardMaterial({ color: 0x1c1c22, roughness: 0.8 }));
  bot.rotation.x = Math.PI / 2; bot.position.y = -depth / 2 - 0.004; g.add(bot);
  for (const s of [1, -1]) {
    const hoop = new THREE.Mesh(new THREE.TorusGeometry(r * 1.018, r * 0.032, 16, 128), chrome);
    hoop.rotation.x = Math.PI / 2; hoop.position.y = s * (depth / 2 + 0.014); hoop.castShadow = true; g.add(hoop);
    const band = new THREE.Mesh(new THREE.CylinderGeometry(r * 1.03, r * 1.03, 0.03, 128, 1, true), chrome);
    band.position.y = s * (depth / 2 + 0.002); g.add(band);

  if (bead) { const b = new THREE.Mesh(new THREE.TorusGeometry(r * 1.002, r * 0.012, 8, 128), chrome); b.rotation.x = Math.PI / 2; g.add(b); }
  const lugGeo = new THREE.CapsuleGeometry(r * 0.04, Math.min(depth * 0.3, 0.12), 4, 12);
  const rodGeo = new THREE.CylinderGeometry(r * 0.011, r * 0.011, depth * 0.24, 6);

}
